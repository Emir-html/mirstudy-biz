    <script>
      // Свой «ящик» в памяти браузера: сайт обществознания и этот сайт живут на одном домене
      // (emir-html.github.io) и в одном окне Telegram, поэтому все ключи localStorage получают приставку «biz|».
      (function () {
        try {
          var P = Storage.prototype, LS = window.localStorage, X = "biz|";
          var g = P.getItem, s = P.setItem, r = P.removeItem;
          P.getItem = function (k) { return g.call(this, this === LS ? X + k : k); };
          P.setItem = function (k, v) { return s.call(this, this === LS ? X + k : k, v); };
          P.removeItem = function (k) { return r.call(this, this === LS ? X + k : k); };
        } catch (e) {}
      })();
    </script>
    <script>
      // Открыто как мини-приложение Telegram? Тогда подключаем его официальный скрипт (лежит рядом,
      // без обращения к telegram.org) — до запуска приложения, чтобы данные Telegram были готовы сразу.
      (function () {
        var tg = false;
        try {
          tg = /tgWebApp/.test(location.hash + location.search) ||
            !!sessionStorage.getItem("__telegram__initParams") || !!window.TelegramWebviewProxy;
        } catch (e) {}
        if (tg) document.write('<script src="./tg-web-app.js"><\/script>');
      })();
    </script>
    <script>
      // тема до загрузки приложения — чтобы не было «вспышки» светлого фона
      try {
        var t = localStorage.getItem("ms:theme") || "auto";
        var tgs = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData && window.Telegram.WebApp.colorScheme;
        var dark = t === "dark" || (t === "auto" && (tgs ? tgs === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
